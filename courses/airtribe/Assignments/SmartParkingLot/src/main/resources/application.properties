spring.application.name=smart-parking-lot
server.port=8080

# In-memory H2 database (LOCK_TIMEOUT so concurrent check-ins wait for the row lock instead of failing fast)
spring.datasource.url=jdbc:h2:mem:parkingdb;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
