server {
  listen 80;

  location / {
    # "api" resolves via Docker Compose's built-in DNS to the Java container
    # Spring Boot runs on port 8080 (not 3000 like Node.js)
    proxy_pass http://api:8080;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # Increase timeout — Java/Spring Boot startup can be slow
    proxy_connect_timeout 60s;
    proxy_read_timeout    60s;
  }
}
