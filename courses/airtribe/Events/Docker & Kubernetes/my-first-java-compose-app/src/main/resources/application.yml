server:
  port: ${PORT:8080}

spring:
  application:
    name: java-compose-api

  # ── PostgreSQL (replaces: new Pool({ host, port, database, user, password })) ──
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appdb}
    username: ${DB_USER:appuser}
    password: ${DB_PASSWORD:supersecret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # "update" = create tables if they don't exist, add columns if needed
      # Use "validate" in production (never auto-alter a prod DB)
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Redis (replaces: redis.createClient({ socket: { host, port } })) ──
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
