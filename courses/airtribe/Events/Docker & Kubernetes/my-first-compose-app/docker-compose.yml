# docker-compose.yml — the main Compose file
# Run with: docker compose up -d

name: myapp   # sets the project name (overrides COMPOSE_PROJECT_NAME)

# ─────────────────────────────────────────────
# SERVICES — each service becomes one container
# ─────────────────────────────────────────────
services:

  # ── 1. PostgreSQL database ──────────────────
  db:
    image: postgres:16-alpine          # use official image — no Dockerfile needed
    container_name: myapp-db
    restart: unless-stopped            # restart on crash, but not if manually stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data         # named volume — data survives restarts
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql  # auto-runs on first start
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 2. Redis cache ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: myapp-redis
    restart: unless-stopped
    command: redis-server --save 60 1  # persist snapshot every 60s if ≥1 key changed
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── 3. Node.js API ───────────────────────────
  api:
    build:
      context: ./api        # folder that contains the Dockerfile
      dockerfile: Dockerfile
    container_name: myapp-api
    restart: unless-stopped
    environment:
      # These resolve using values from .env
      DB_HOST:     db         # "db" is the service name — Compose DNS resolves it
      DB_PORT:     ${DB_PORT}
      DB_NAME:     ${DB_NAME}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST:  redis
      REDIS_PORT:  ${REDIS_PORT}
      PORT:        ${API_PORT}
      NODE_ENV:    ${NODE_ENV}
    depends_on:
      db:
        condition: service_healthy     # wait until db passes its healthcheck
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend
    # No ports exposed directly — traffic comes through nginx only

  # ── 4. Nginx reverse proxy ───────────────────
  nginx:
    image: nginx:alpine
    container_name: myapp-nginx
    restart: unless-stopped
    ports:
      - "8080:80"            # host:container — visit localhost:8080
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro  # :ro = read-only mount
    depends_on:
      - api
    networks:
      - frontend

# ─────────────────────────────────────────────
# VOLUMES — named volumes managed by Docker
# ─────────────────────────────────────────────
volumes:
  db-data:      # postgres data persisted here
  redis-data:   # redis snapshot persisted here

# ─────────────────────────────────────────────
# NETWORKS — isolated virtual networks
# ─────────────────────────────────────────────
networks:
  backend:      # db, redis, and api talk here — nginx cannot reach db/redis directly
  frontend:     # nginx and api talk here
