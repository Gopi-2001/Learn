# Default values — override with --set or -f values-prod.yaml

replicaCount: 2

image:
  repository: hello-java
  tag: "1.0.0"
  pullPolicy: Never    # use local minikube image

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  host: hello-java.local

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

env:
  PORT: "8080"

probes:
  liveness:
    path: /actuator/health
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    path: /actuator/health
    initialDelaySeconds: 20
    periodSeconds: 5
