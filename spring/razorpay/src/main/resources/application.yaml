# ==============================================================================
# ENVIRONMENT VARIABLES & FALLBACK LOGIC
# Syntax: ${VARIABLE_NAME:fallback_value}
# If the environment variable exists on the system, Spring Boot injects it.
# Otherwise, it falls back to the local default value provided after the colon.
# ==============================================================================

spring:
  application:
    name: razorpay

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db-name}
    username: ${DB_USER:user}   # Defaults to your single admin user 'postgres'
    password: ${DB_PASSWORD:password}      # Leave blank or insert fallback if required

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    show-sql: true                  # Prints SQL queries in your terminal console
    properties:
      hibernate:
        format_sql: true            # Formats printed SQL to be human-readable
        dialect: org.hibernate.dialect.PostgreSQLDialect  # Deprecated, therefore PostgreSQLDialect does not need to be specified explicitly using 'hibernate.dialect'
    hibernate:
      ddl-auto: update              # Automatically updates database schemas based on entity updates

  kafka:
    listener:
      ack-mode: manual
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 3
        spring.json.add.type.headers: false
    consumer:
      group-id: razorpay-monolith
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.project.razorpay.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap

threads:
  virtual:
    enabled: true


vault:
  master-key: ${MASTER_KEY}


payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: NORMAL
    method:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 2
        success-rate: 95
      NET_BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80


jwt:
  secret-key: ${SECRET_KEY}


app:
  rate-limit:
    method: ${RATE_LIMIT_METHOD:fixed}
    use-case:
      api-key:
        request-per-minute: ${REQ_PER_MIN:200}
  kafka:
    topics:
      payments: payments.events
      order: orders.events
      refund: refund.events
      settlement: settlement.events
  webhook:
    delivery:
      redis-key: "webhook-retry"
      poll-batch-size: 100

